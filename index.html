<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>AI OnAd Rawdata Collector</title>
<style>
  :root {
    --bg: #0b0d10;
    --panel: #14171c;
    --border: #262b33;
    --text: #e6e8eb;
    --muted: #8b93a1;
    --accent: #4f8cff;
    --ok: #3ecf8e;
    --warn: #f2b84b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans KR", sans-serif;
  }
  .wrap { max-width: 760px; margin: 0 auto; padding: 48px 20px; }
  h1 { font-size: 20px; font-weight: 600; margin: 0 0 4px; }
  .sub { color: var(--muted); font-size: 13px; margin-bottom: 28px; }
  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 20px;
    margin-bottom: 16px;
  }
  input[type="password"] {
    width: 100%; padding: 10px 12px; border-radius: 8px;
    border: 1px solid var(--border); background: #0f1216; color: var(--text);
    font-size: 14px; margin-bottom: 12px;
  }
  button {
    background: var(--accent); color: white; border: none;
    padding: 9px 16px; border-radius: 8px; font-size: 13px;
    cursor: pointer; font-weight: 500;
  }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  button.small { padding: 4px 10px; font-size: 12px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--border); }
  th { color: var(--muted); font-weight: 500; }
  .status-ok { color: var(--ok); }
  .status-none { color: var(--muted); }
  .size { color: var(--muted); font-variant-numeric: tabular-nums; }
  a.dl { color: var(--accent); text-decoration: none; }
  a.dl:hover { text-decoration: underline; }
  #msg, #loginMsg { font-size: 13px; color: var(--warn); margin-top: 10px; min-height: 18px; }
  .toolbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>AI OnAd Rawdata Collector</h1>
  <div class="sub">일일 원시 로그 수집 현황 (Vercel Blob)</div>

  <div id="login" class="panel">
    <input id="password" type="password" placeholder="비밀번호" onkeydown="if(event.key==='Enter') login()" />
    <button onclick="login()">로그인</button>
    <div id="loginMsg"></div>
  </div>

  <div id="dashboard" class="panel" style="display:none;">
    <div class="toolbar">
      <span class="sub" style="margin:0;">최근 45일 (어제부터)</span>
      <button onclick="collectNow()" id="collectBtn">지금 수집 (D-1)</button>
    </div>
    <table>
      <thead><tr><th>날짜</th><th>상태</th><th>크기</th><th></th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
    <div id="msg"></div>
  </div>
</div>

<script>
function fmtSize(bytes) {
  if (bytes == null) return '-';
  return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
}

function showDashboard() {
  document.getElementById('login').style.display = 'none';
  document.getElementById('dashboard').style.display = 'block';
}

function showLogin() {
  document.getElementById('login').style.display = 'block';
  document.getElementById('dashboard').style.display = 'none';
}

async function login() {
  const password = document.getElementById('password').value;
  const r = await fetch('/api/login', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ password }),
  });
  if (r.ok) {
    showDashboard();
    loadStatus();
  } else {
    document.getElementById('loginMsg').textContent = '비밀번호가 올바르지 않습니다.';
  }
}

async function loadStatus() {
  const r = await fetch('/api/status');
  if (r.status === 401) {
    showLogin();
    return;
  }
  showDashboard();
  const data = await r.json();
  const tbody = document.getElementById('rows');
  tbody.innerHTML = '';
  for (const row of data.rows) {
    const tr = document.createElement('tr');
    const isOk = row.status === '완료';
    const action = isOk
      ? `<a class="dl" href="/api/download?date=${row.date}">다운로드</a>`
      : `<button class="small" onclick="collectDate('${row.date}')">수집</button>`;
    tr.innerHTML = `
      <td>${row.date}</td>
      <td class="${isOk ? 'status-ok' : 'status-none'}">${row.status}</td>
      <td class="size">${fmtSize(row.size)}</td>
      <td>${action}</td>
    `;
    tbody.appendChild(tr);
  }
}

async function runCollect(date) {
  document.getElementById('msg').textContent = '수집 중... (최대 몇 분 걸릴 수 있음)';
  try {
    const r = await fetch('/api/collect', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(date ? { date } : {}),
    });
    document.getElementById('msg').textContent = await r.text();
  } catch (e) {
    document.getElementById('msg').textContent = '오류: ' + e;
  }
  loadStatus();
}

async function collectNow() {
  const btn = document.getElementById('collectBtn');
  btn.disabled = true;
  await runCollect(null);
  btn.disabled = false;
}

function collectDate(date) {
  runCollect(date);
}

loadStatus();
</script>
</body>
</html>
